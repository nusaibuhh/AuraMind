version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: auramind
      POSTGRES_PASSWORD: auramindpass
      POSTGRES_DB: auramind
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./FastAPI
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://auramind:auramindpass@db:5432/auramind
      SECRET_KEY: change-me-in-prod
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata:
