version: '3.8'

services:
  db:
    image: mysql:8.0
    command: --lower-case-table-names=1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: auramind
      MYSQL_USER: auramind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auramindpass}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./FastAPI
    restart: unless-stopped
    env_file:
      - ./FastAPI/.env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: auramind
      MYSQL_USER: auramind
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-auramindpass}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
